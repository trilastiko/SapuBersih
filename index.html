<html lang="id" data-theme="kode">
<head>
  <meta charset="UTF-8" />

  <title>SapuBersih — Platform Penemuan &amp; Bukti Judi Online</title>
  <meta name="description" content="SapuBersih — platform penemuan, klasifikasi, dan dokumentasi bukti situs judi online. Demo untuk Komdigi oleh KODE." />
  <link rel="preload" href="assets/fonts/plex-sans-400.woff2" as="font" type="font/woff2" crossorigin />
  <link rel="preload" href="assets/fonts/plex-sans-600.woff2" as="font" type="font/woff2" crossorigin />
  <link rel="stylesheet" href="assets/css/theme.css" />
  <link rel="stylesheet" href="assets/css/app.css" />
  <link rel="stylesheet" href="assets/css/components.css" />
  <link rel="stylesheet" href="assets/css/print.css" media="print" />

<body>
  <!-- Boot splash (removed after JS mounts) -->
  <div id="boot">
    <div class="boot-mark">SapuBersih</div>
    <div class="boot-sub">Memuat lingkungan demo lokal…</div>
  </div>

  <!-- App shell is rendered by app.js into #root -->
  <div id="root" hidden>
    <aside id="sidebar"></aside>
    <div id="main">
      <header id="topbar"></header>
      <main id="view" tabindex="-1"></main>
    </div>
  </div>

  <!-- Overlay layers -->
  <div id="drawer-root"></div>
  <div id="modal-root"></div>
  <div id="toast-root"></div>

  <!-- No modules, no fetch: guarantees file:// and offline operation -->
  <script src="assets/js/util.js"></script>
  <script src="assets/js/seed.js"></script>
  <script src="assets/js/store.js"></script>
  <script src="assets/js/charts.js"></script>
  <script src="assets/js/cluster.js"></script>
  <script src="assets/js/components.js"></script>
  <script src="assets/js/views-dashboard.js"></script>
  <script src="assets/js/views-discovery.js"></script>
  <script src="assets/js/views-ingestion.js"></script>
  <script src="assets/js/views-classify.js"></script>
  <script src="assets/js/views-cluster.js"></script>
  <script src="assets/js/views-review.js"></script>
  <script src="assets/js/views-monitoring.js"></script>
  <script src="assets/js/views-report.js"></script>
  <script src="assets/js/views-audit.js"></script>
  <script src="assets/js/views-settings.js"></script>
  <script src="assets/js/app.js"></script>
